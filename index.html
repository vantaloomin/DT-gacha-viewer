<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Gallery</title>
<link rel="stylesheet" href="vendor/inter.css">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/spine-player.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-head">
      <div class="brand"><h1>Hero Gallery<small>DRAGON TRAVELER</small></h1>
        <span style="display:flex;gap:2px"><button class="btn ghost icon" id="whatsNew" data-tip="What’s new in the last update" aria-label="What’s new" style="display:none;position:relative"></button>
        <button class="btn ghost icon" id="helpBtn" data-tip="Keyboard shortcuts" data-kbd="?" aria-label="Keyboard shortcuts"></button></span></div>
      <label class="field" id="searchField"><span class="s-ic"></span><input id="q" type="search" placeholder="Search heroes or outfits" autocomplete="off" aria-label="Search heroes"><kbd>/</kbd><button class="clear" type="button" aria-label="Clear search"></button></label>
      <div id="category"></div>
      <div class="filter-bar"><button class="btn sm" id="filterBtn" aria-label="Filters"></button><span id="sortWrap"></span></div>
      <div class="active-filters" id="activeFilters"></div>
    </div>
    <div class="side-list" id="heroes" role="listbox" aria-label="Heroes"></div>
    <div class="side-foot"><span id="count"></span><a href="viewer.html" id="allRigs"></a></div>
  </aside>

  <main class="main">
    <div class="head">
      <button class="btn ghost icon menu-toggle" id="menuBtn" aria-label="Show hero list"></button>
      <img class="portrait" id="portrait" alt="">
      <div style="min-width:0"><h2 id="heroName">Loading…</h2><div class="sub" id="heroSub"></div><div class="badges" id="heroBadges"></div></div>
    </div>
    <div class="outfits" id="outfits" role="tablist" aria-label="Outfits"></div>
    <div class="tabbar">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-tab="profile" data-kbd="1"></button>
        <button class="tab" role="tab" data-tab="spine" data-kbd="2"></button>
        <button class="tab" role="tab" data-tab="art" data-kbd="3"></button>
        <button class="tab" role="tab" data-tab="video" data-kbd="4"></button>
        <button class="tab" role="tab" data-tab="model" data-kbd="5"></button>
      </div>
      <span class="spacer"></span>
      <button class="btn ghost icon" id="fullBtn" data-tip="Fullscreen" data-kbd="F" aria-label="Fullscreen"></button>
      <button class="btn primary" id="exportBtn" data-tip="Export image, GIF or video" data-kbd="E"></button>
    </div>

    <section class="panel" id="panel-profile" role="tabpanel"><div class="profile" id="profile"></div></section>

    <section class="panel" id="panel-spine" role="tabpanel">
      <div class="stage-wrap" id="spineWrap">
        <div class="stage" id="spineStage"><div class="phone" id="phone"><div class="screen" id="screen"></div></div></div>
        <div class="loading" id="spineLoading"><div class="ld"><div class="spinner"></div><span></span></div></div>
      </div>
    </section>

    <section class="panel" id="panel-art" role="tabpanel">
      <div class="toolbar"><span id="censorWrap"></span><span style="flex:1"></span><span id="artCount"></span></div>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="panel" id="panel-video" role="tabpanel"><div id="videoBox" style="flex:1;display:flex;min-height:0"></div></section>

    <section class="panel" id="panel-model" role="tabpanel">
      <div class="stage-wrap" id="modelWrap">
        <div class="stage model-stage" id="modelStage"><div class="model-box" id="modelBox"></div></div>
        <div class="stage-hint" id="modelHint">Drag to orbit · Right-drag to pan · Scroll to zoom</div>
        <div class="loading" id="modelLoading"><div class="ld"><div class="spinner"></div><span></span></div></div>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { icon, h, esc, store, recall, dropdown, segmented, toggle, slider, swatches, popover, toast, modal, lightbox, initTooltips, typing, anyLayerOpen, closePopovers } from './js/ui.js';
import { SpineStage, layoutPhone } from './js/spine-stage.js';
import { createDock, createExportDrawer, createVideoPlayer, groupClip, clipLabel, attachTaps, spineSettings, spineAnimItems } from './js/player-ui.js';
import { voiceSettings, saveVoiceSettings, playVoice, stopVoice, setSoundEnabled } from './js/voice.js';
import { safeFilename } from './js/export.js';
import { keepAlive } from './js/keepalive.js';
keepAlive();

const $ = s => document.querySelector(s);
initTooltips();

// Static icons
$('#helpBtn').innerHTML = icon('keyboard');
$('#searchField .s-ic').outerHTML = icon('search');
$('#searchField .clear').innerHTML = icon('x');
$('#allRigs').innerHTML = `${icon('grid')}All Spine rigs`;
$('#menuBtn').innerHTML = icon('menu');
$('#fullBtn').innerHTML = icon('maximize');
$('#exportBtn').innerHTML = `${icon('download')}<span>Export</span>`;
const TABS = { profile: ['user', 'Profile'], spine: ['sparkles', 'Animated'], art: ['image', 'Art'], video: ['film', 'Videos'], model: ['box', '3D Model'] };
document.querySelectorAll('.tab').forEach(t => { const [ic, label] = TABS[t.dataset.tab]; t.innerHTML = `${icon(ic)}<span class="t-label">${label}</span>`; });

// ---------- Data ----------
let heroes = [], models = {}, rigs = {};
let hero = null, skin = null, tab = null, visible = [];
const [data, manifest] = await Promise.all([
  fetch('heroes.json', { cache: 'no-cache' }).then(r => r.json()),
  fetch('manifest.json', { cache: 'no-cache' }).then(r => r.json()),
]).catch(e => { toast('Could not load the gallery data', { type: 'error', message: e.message, duration: 0 }); throw e; });
heroes = data.heroes; models = data.models || {};
const arenas = Object.fromEntries((data.arenas || []).map(a => [a.id, a]));
// Biography, skills and voice lines per hero (written by _tools/build_profiles.py; optional)
const profiles = await fetch('profiles.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
const whatsNew = await fetch('whatsnew.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
// "New" markers last until seen: the badge until What's new is opened, a hero's tag until that hero is opened.
// Keyed to this update, so the next update with changes shows them again.
const wnKey = whatsNew ? `${whatsNew.date}|${whatsNew.gameVersion}` : '';
const wnSeen = (() => { try { const v = JSON.parse(recall('whatsNewSeen', '{}')); return v.key === wnKey ? v : { key: wnKey, opened: false, heroes: [] }; } catch { return { key: wnKey, opened: false, heroes: [] }; } })();
const saveSeen = () => store('whatsNewSeen', JSON.stringify(wnSeen));
const newHeroIds = new Set([...(whatsNew?.newHeroes || []).map(x => x.hero), ...(whatsNew?.newOutfits || []).map(x => x.hero)].filter(id => !wnSeen.heroes.includes(id)));
for (const r of manifest) rigs[r.skel] = r;
const caps = s => ({ spine: !!s.spine, art: Object.keys(s.art).length > 0, video: Object.keys(s.videos).length > 0, model: !!s.model });
const heroCaps = h => h.skins.reduce((a, s) => { const c = caps(s); for (const k in c) a[k] ||= c[k]; return a; }, {});
const thumb = (src, name, cls = 'thumb') => src ? `<img class="${cls}" loading="lazy" src="${esc(src)}" alt="">` : `<span class="${cls} ph">${esc((name || '?')[0])}</span>`;

// ---------- Sidebar: category, filters (the game's class / faction / rarity), sort ----------
const tax = data.taxonomy || { classes: [], factions: [], rarities: [] };
const byId = arr => Object.fromEntries(arr.map(x => [x.id, x]));
const CLS = byId(tax.classes), FAC = byId(tax.factions), RAR = byId(tax.rarities);
const HAS = { spine: ['Animated', 'sparkles'], model: ['3D model', 'box'], video: ['Videos', 'film'] };
const F = Object.assign({ category: 'hero', classes: [], factions: [], rarities: [], has: [], sort: 'name' },
  (() => { try { return JSON.parse(recall('heroFilters', '{}')) || {}; } catch { return {}; } })());
const saveF = () => store('heroFilters', JSON.stringify(F));
const activeCount = () => F.classes.length + F.factions.length + F.rarities.length + F.has.length;
const rarityTag = q => RAR[q] ? `<span class="rtag" style="color:${esc(RAR[q].color)}">${esc(RAR[q].name)}</span>` : '';

const catSeg = segmented({ block: true, value: F.category, label: 'Category',
  options: [{ value: 'hero', label: 'Heroes', tip: `${heroes.filter(h => h.category === 'hero').length} playable heroes` },
            { value: 'monster', label: 'Bosses & monsters', tip: `${heroes.filter(h => h.category === 'monster').length} bosses, monsters and NPCs` }],
  onChange: v => { F.category = v; saveF(); renderHeroes(); } });
$('#category').append(catSeg);
const sortDd = dropdown({ prefix: 'Sort:', value: F.sort, onChange: v => { F.sort = v; saveF(); renderHeroes(); },
  items: [{ value: 'name', label: 'Name' }, { value: 'rarity', label: 'Rarity' }, { value: 'class', label: 'Class' }] });
$('#sortWrap').append(sortDd);

function matches(h) {
  return h.category === F.category
    && (!F.classes.length || F.classes.includes(h.class))
    && (!F.factions.length || h.factions.some(f => F.factions.includes(f)))
    && (!F.rarities.length || F.rarities.includes(h.quality))
    && F.has.every(k => heroCaps(h)[k]);
}
const SORTS = {
  name: (a, b) => a.name.localeCompare(b.name),
  rarity: (a, b) => b.quality - a.quality || a.name.localeCompare(b.name),
  class: (a, b) => (a.class || 99) - (b.class || 99) || a.name.localeCompare(b.name),
};
const toggleIn = (arr, v) => { const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); };

function renderActiveFilters() {
  const box = $('#activeFilters'); box.innerHTML = '';
  const chip = (label, img, onRemove, color) => {
    const c = h(`<span class="afchip">${img ? `<img src="${esc(img)}" alt="">` : ''}<span${color ? ` style="color:${esc(color)}"` : ''}>${esc(label)}</span><button type="button" aria-label="Remove ${esc(label)} filter">${icon('x')}</button></span>`);
    c.querySelector('button').onclick = () => { onRemove(); saveF(); renderHeroes(); };
    box.append(c);
  };
  F.classes.forEach(id => chip(CLS[id]?.name || id, CLS[id]?.icon, () => toggleIn(F.classes, id)));
  F.factions.forEach(id => chip(FAC[id]?.name || id, FAC[id]?.icon, () => toggleIn(F.factions, id)));
  F.rarities.forEach(id => chip(RAR[id]?.name || id, null, () => toggleIn(F.rarities, id), RAR[id]?.color));
  F.has.forEach(k => chip(HAS[k][0], null, () => toggleIn(F.has, k)));
  if (activeCount()) {
    const clear = h('<button type="button" class="afclear">Clear all</button>');
    clear.onclick = () => { F.classes = []; F.factions = []; F.rarities = []; F.has = []; saveF(); renderHeroes(); };
    box.append(clear);
  }
  box.style.display = activeCount() ? '' : 'none';
  const n = activeCount();
  $('#filterBtn').innerHTML = `${icon('sliders')}<span>Filters</span>${n ? `<span class="badge on">${n}</span>` : ''}`;
}

// Filter panel (popover): icon toggles for class and faction, chips for rarity and content
popover($('#filterBtn'), () => {
  const el = h(`<div class="fpop">
    <div class="pop-row"><h4>Class</h4><div class="fgrid cls"></div></div>
    <div class="pop-row"><h4>Faction</h4><div class="fgrid fac"></div></div>
    <div class="pop-row"><h4>Rarity</h4><div class="fchips rar"></div></div>
    <div class="pop-row"><h4>Has</h4><div class="fchips has"></div></div>
    <div class="row-between fpop-foot"><span class="fcount"></span><button class="btn sm ghost fclear">Clear all</button></div></div>`);
  const sync = () => {
    el.querySelectorAll('[data-g]').forEach(b => b.setAttribute('aria-pressed', F[b.dataset.g].includes(b.dataset.g === 'has' ? b.dataset.v : +b.dataset.v)));
    el.querySelector('.fcount').textContent = `${visible.length} match${visible.length === 1 ? '' : 'es'}`;
  };
  const add = (box, group, value, html, tip) => {
    const b = h(`<button type="button" class="ftog" data-g="${group}" data-v="${esc(value)}"${tip ? ` data-tip="${esc(tip)}"` : ''}>${html}</button>`);
    b.onclick = () => { toggleIn(F[group], group === 'has' ? value : +value); saveF(); renderHeroes(); sync(); };
    el.querySelector(box).append(b);
  };
  for (const c of tax.classes) add('.cls', 'classes', c.id, `${c.icon ? `<img src="${esc(c.icon)}" alt="">` : ''}<span>${esc(c.name)}</span>`);
  for (const f of tax.factions) add('.fac', 'factions', f.id, `${f.icon ? `<img src="${esc(f.icon)}" alt="">` : ''}<span>${esc(f.name)}</span>`, f.name);
  for (const r of tax.rarities) add('.rar', 'rarities', r.id, `<span class="rdot" style="background:${esc(r.color)}"></span><span>${esc(r.name)}</span>`);
  for (const [k, [label, ic]] of Object.entries(HAS)) add('.has', 'has', k, `${icon(ic)}<span>${esc(label)}</span>`);
  el.querySelector('.fclear').onclick = () => { F.classes = []; F.factions = []; F.rarities = []; F.has = []; saveF(); renderHeroes(); sync(); };
  sync();
  return el;
}, { prefer: 'below', align: 'start' });

const searchText = h => [h.name, h.title, ...h.skins.map(s => s.name), CLS[h.class]?.name, RAR[h.quality]?.name, ...h.factions.map(f => FAC[f]?.name)].join(' ').toLowerCase();
function renderHeroes() {
  const q = $('#q').value.trim().toLowerCase();
  $('#searchField').classList.toggle('has-value', !!q);
  catSeg.value = F.category; sortDd.value = F.sort;
  visible = heroes.filter(h => matches(h) && (!q || searchText(h).includes(q))).sort(SORTS[F.sort] || SORTS.name);
  const list = $('#heroes');
  list.innerHTML = '';
  if (!visible.length) list.innerHTML = `<div class="list-empty">No ${F.category === 'hero' ? 'heroes' : 'bosses or monsters'} match${q ? ` “${esc(q)}”` : ''}${activeCount() ? ' with these filters' : ''}.</div>`;
  for (const h of visible) {
    const b = document.createElement('button');
    b.className = 'item' + (h === hero ? ' on' : ''); b.setAttribute('role', 'option'); b.setAttribute('aria-selected', h === hero);
    b.dataset.tip = [h.name, h.title, RAR[h.quality]?.name, CLS[h.class]?.name, h.factions.map(f => FAC[f]?.name).filter(Boolean).join(' / '), h.skins.length > 1 ? `${h.skins.length} outfits` : ''].filter(Boolean).join(' · ');
    const cls = CLS[h.class];
    b.innerHTML = `${thumb(h.icon, h.name)}<span class="meta"><div class="name">${esc(h.name)}${newHeroIds.has(h.id) ? '<span class="new-tag">new</span>' : ''}</div><div class="sub">${esc(h.title)}</div></span>
      <span class="caps"><span class="c-rar">${rarityTag(h.quality)}</span><span class="c-cls">${cls?.icon ? `<img class="cicon" src="${esc(cls.icon)}" alt="${esc(cls.name)}">` : ''}</span><span class="c-n">${h.skins.length > 1 ? `<span class="badge">${h.skins.length}</span>` : ''}</span></span>`;
    b.onclick = () => { selectHero(h); $('#app').classList.remove('nav-open'); };
    list.append(b);
  }
  const total = heroes.filter(h => h.category === F.category).length, noun = F.category === 'hero' ? 'heroes' : 'bosses & monsters';
  $('#count').textContent = visible.length === total ? `${total} ${noun}` : `${visible.length} of ${total} ${noun}`;
  renderActiveFilters();
}
$('#q').oninput = renderHeroes;
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') { $('#q').value = ''; renderHeroes(); $('#q').blur(); } if (e.key === 'Enter' && visible[0]) selectHero(visible[0]); });
$('#searchField .clear').onclick = () => { $('#q').value = ''; renderHeroes(); $('#q').focus(); };
$('#menuBtn').onclick = () => $('#app').classList.toggle('nav-open');

// ---------- Selection & routing (#h=heroId&s=skinId&t=tab) ----------
function selectHero(h, skinId, tabName) {
  hero = h;
  if (newHeroIds.delete(h.id)) {
    wnSeen.heroes.push(h.id); saveSeen();
    document.querySelectorAll('#heroes .item').forEach((b, i) => visible[i] === h && b.querySelector('.new-tag')?.remove());
  }
  if (h.category !== F.category) { F.category = h.category; saveF(); renderHeroes(); }
  document.querySelectorAll('#heroes .item').forEach((b, i) => { const on = visible[i] === h; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); if (on) b.scrollIntoView({ block: 'nearest' }); });
  $('#portrait').src = h.icon || ''; $('#portrait').style.visibility = h.icon ? '' : 'hidden';
  $('#heroName').textContent = h.name;
  $('#heroSub').textContent = [h.title, `${h.skins.length} outfit${h.skins.length > 1 ? 's' : ''}`].filter(Boolean).join(' · ');
  document.title = `${h.name} · Hero Gallery`;
  const cls = CLS[h.class];
  $('#heroBadges').innerHTML = [
    RAR[h.quality] ? `<span class="hb rar" style="color:${esc(RAR[h.quality].color)};border-color:${esc(RAR[h.quality].color)}55">${esc(RAR[h.quality].name)}</span>` : '',
    cls ? `<span class="hb">${cls.icon ? `<img src="${esc(cls.icon)}" alt="">` : ''}${esc(cls.name)}</span>` : '',
    ...h.factions.map(f => FAC[f] ? `<span class="hb">${FAC[f].icon ? `<img src="${esc(FAC[f].icon)}" alt="">` : ''}${esc(FAC[f].name)}</span>` : ''),
    h.category === 'monster' ? '<span class="hb">Boss / monster</span>' : '',
  ].join('');
  const box = $('#outfits'); box.innerHTML = '';
  for (const s of h.skins) {
    const c = caps(s);
    const tip = [c.spine && 'Animated', c.art && 'Art', c.video && 'Videos', c.model && '3D model'].filter(Boolean).join(' · ');
    const b = h_(`<button class="outfit" role="tab" data-id="${s.id}" data-tip="${esc(tip)}">${thumb(s.icon || h.icon, s.name, '')}<span><span class="o-name">${esc(s.name)}</span>
      <span class="o-caps">${c.spine ? icon('sparkles') : ''}${c.art ? icon('image') : ''}${c.video ? icon('film') : ''}${c.model ? icon('box') : ''}</span></span></button>`);
    b.onclick = () => selectSkin(s);
    box.append(b);
  }
  selectSkin(h.skins.find(s => s.id === skinId) || h.skins[0], tabName, false);
}
const h_ = h;

const TAB_ORDER = ['profile', 'art', 'model', 'video', 'spine'];
// The tab you last picked yourself (click, 1-4 keys or a link) carries over to other heroes that have it;
// otherwise a hero opens on Art, then 3D model, videos, animated. Changing outfit keeps the current tab.
let chosenTab = null;
const pickTab = name => { chosenTab = name; selectTab(name); };
function selectSkin(s, tabName, keepTab = true) {
  skin = s;
  document.querySelectorAll('.outfit').forEach(b => { const on = +b.dataset.id === s.id; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
  const c = { ...caps(s), profile: !!profiles[hero.id] };   // the Profile is per hero, the rest per outfit
  document.querySelectorAll('.tab').forEach(t => {
    t.disabled = !c[t.dataset.tab];
    t.dataset.tip = t.disabled ? `${TABS[t.dataset.tab][1]} — not available for this outfit` : TABS[t.dataset.tab][1];
  });
  spineStage.dispose(); spineLoaded = null; modelLoaded = null;
  selectTab([tabName, chosenTab, keepTab && tab, ...TAB_ORDER].find(t => t && c[t]) || 'art');
}

function selectTab(name) {
  if (tab === 'video' && name !== 'video') video?.stop();
  if (tab === 'spine' && name !== 'spine') stopVoice();
  tab = name;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'panel-' + name));
  $('#exportBtn').style.display = $('#fullBtn').style.display = name === 'spine' || name === 'model' ? '' : 'none';
  if (name === 'video') $('#fullBtn').style.display = '';
  history.replaceState(null, '', `#h=${hero.id}&s=${skin.id}&t=${name}`);
  if (tab !== 'profile') stopProfileAudio();
  ({ profile: showProfile, spine: showSpine, art: showArt, video: showVideos, model: showModel })[name]();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => !t.disabled && pickTab(t.dataset.tab));

function route() {
  const p = new URLSearchParams(location.hash.slice(1));
  // No hero in the link: open the first one in the (saved) sidebar list rather than the first overall
  const h = heroes.find(h => h.id === +p.get('h')) || hero || visible[0] || heroes.find(x => x.category === F.category) || heroes[0];
  if (h !== hero) return selectHero(h, +p.get('s'), p.get('t'));
  const s = h.skins.find(s => s.id === +p.get('s'));
  if (s && s !== skin) return selectSkin(s, p.get('t'));
  const t = p.get('t');
  if (t && t !== tab && !document.querySelector(`.tab[data-tab="${t}"]`)?.disabled) pickTab(t);
}
addEventListener('hashchange', route);

function setLoading(el, state, text = '') {
  el.style.display = state ? '' : 'none';
  el.classList.toggle('error', state === 'error');
  el.querySelector('span').textContent = text;
}

// ---------- Export drawer (shared) ----------
const drawer = createExportDrawer();
const activeAdapter = () => tab === 'spine' ? spineAdapter : tab === 'model' ? modelAdapter : null;
$('#exportBtn').onclick = () => activeAdapter() && drawer.open(activeAdapter());
$('#fullBtn').onclick = () => {
  const el = $(tab === 'spine' ? '#spineWrap' : '#modelWrap');
  if (tab === 'video') return video?.fullscreen();
  document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen();
};

// ---------- Animated (Spine) ----------
const spineStage = new SpineStage($('#screen'));
spineStage.restricted = recall('restricted') === 'true';
let spineLoaded = null, spineReady = false;
let phoneZoom = +recall('phoneZoom', 100);
const interactions = await fetch('interactions.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
const spineAdapter = {
  kind: 'spine',
  ready: () => spineReady && !!spineStage.player?.skeleton,
  get paused() { return spineStage.paused; }, get time() { return spineStage.time; }, get duration() { return spineStage.duration(); },
  pause: () => spineStage.pause(), resume: () => spineStage.resume(), seek: t => spineStage.seek(t),
  animations: () => spineAnimItems(spineStage),
  current: () => spineStage.mode === 'interactive' ? '__interactive' : spineStage.anim,
  setAnimation: n => { n === '__interactive' ? spineStage.startInteractive() : spineStage.play(n); spineDock.sync(); updateTapHint(); },
  settings: () => spineSettings(spineStage, {
    zoom: () => phoneZoom, setZoom: v => { phoneZoom = v; store('phoneZoom', v); layoutSpine(); }, taps,
    voice: { settings: voiceSettings, save: saveVoiceSettings, greet: () => greet(true), setEnabled: v => { sound.set(v); spineDock.syncSound(); } },
  }),
  beginCapture: o => spineStage.beginCapture(o),
  aspect: f => f === 'phone' && spineStage.camRect ? spineStage.camRect.w / spineStage.camRect.h : null,
  filename: () => `${hero.name} - ${skin.name} - ${spineStage.anim}`,
};
const sound = { get on() { return voiceSettings.enabled; }, set(v) { setSoundEnabled(v); if (v) greet(true); } };
const spineDock = createDock($('#spineWrap'), spineAdapter, { onSnapshot: () => drawer.snapshot(spineAdapter), sound });
const taps = attachTaps($('#screen'), spineStage);
const tapHint = h(`<div class="chip-hint" style="opacity:0">${icon('pointer')}<span>Tap the character to interact</span></div>`);
$('#spineWrap').append(tapHint);
function updateTapHint() {
  const on = spineStage.mode === 'interactive' && spineStage.inter?.clicks.length > 0;
  tapHint.style.opacity = on ? 1 : 0;
  clearTimeout(updateTapHint.t);
  if (on) updateTapHint.t = setTimeout(() => tapHint.style.opacity = 0, 4000);
}
// Voice lines: the act's one-shot animations map to the outfit's click voices
spineStage.onAct = (act, names) => {
  const v = spineStage.inter?.voices?.anims;
  if (!v) return;
  for (const n of names) if (v[n]) { playVoice(v[n]); break; }
};
function greet(force) {
  const v = interactions[skin.spine]?.voices?.appear;
  if (!v || (!force && !voiceSettings.greet)) return;
  playVoice(v, { force }).then(ok => { if (!ok && force) toast('No voice line available', { message: 'This outfit’s greeting isn’t in the extracted audio.', type: 'info', duration: 3000 }); });
}

function layoutSpine() { layoutPhone($('#spineStage'), $('#phone'), $('#screen'), phoneZoom); }
new ResizeObserver(() => tab === 'spine' && layoutSpine()).observe($('#spineStage'));

async function showSpine() {
  layoutSpine();
  if (spineLoaded === skin.spine) return;
  spineLoaded = skin.spine; spineReady = false;
  stopVoice();
  setLoading($('#spineLoading'), 'loading', 'Loading animation…');
  spineDock.el.style.visibility = 'hidden';
  try {
    spineStage.camMode = recall('camMode', 'screen');
    await spineStage.load(rigs[skin.spine], interactions[skin.spine]);
  } catch (e) { if (spineLoaded === skin.spine) setLoading($('#spineLoading'), 'error', 'Couldn’t load this animation: ' + e.message); return; }
  if (spineLoaded !== skin.spine) return;   // switched away while loading
  spineReady = true;
  setLoading($('#spineLoading'), null);
  spineDock.el.style.visibility = '';
  spineDock.refresh();
  updateTapHint();
  greet(false);
}

// ---------- Art ----------
let censored = recall('artCensored') === 'true';
const censorToggle = toggle({ label: 'Censored versions', checked: censored, onChange: v => { censored = v; store('artCensored', String(v)); showArt(); } });
$('#censorWrap').append(censorToggle);
const ART = { painting: 'Portrait', card: 'Card', background: 'Background' };
function showArt() {
  const items = Object.entries(ART).map(([k, label]) => {
    const alt = censored && skin.art[k + 'Censored'];
    const src = alt || skin.art[k];
    return src && { src, title: `${label}${alt ? ' (censored)' : ''}`, download: safeFilename(`${hero.name} - ${skin.name} - ${label}${alt ? ' (censored)' : ''}`) + '.png' };
  }).filter(Boolean);
  censorToggle.style.display = Object.keys(skin.art).some(k => k.endsWith('Censored')) ? '' : 'none';
  $('#artCount').textContent = items.length ? `${items.length} image${items.length > 1 ? 's' : ''}` : '';
  const g = $('#gallery'); g.innerHTML = '';
  if (!items.length) g.innerHTML = `<div class="empty-state">${icon('image')}<span>No art for this outfit.</span></div>`;
  items.forEach((it, i) => {
    const t = h(`<div class="tile"><div class="media shimmer" tabindex="0" role="button" aria-label="View ${esc(it.title)}"><img loading="lazy" src="${esc(it.src)}" alt="${esc(it.title)}"></div>
      <div class="actions"><button class="btn icon sm" data-tip="View full size">${icon('maximize')}</button><a class="btn icon sm" href="${esc(it.src)}" download="${esc(it.download)}" data-tip="Download PNG">${icon('download')}</a></div>
      <div class="cap"><span><b>${esc(it.title)}</b><small></small></span></div></div>`);
    const img = t.querySelector('img');
    img.onload = () => { img.classList.add('loaded'); t.querySelector('.media').classList.remove('shimmer'); t.querySelector('small').textContent = `${img.naturalWidth}×${img.naturalHeight}`; };
    if (img.complete && img.naturalWidth) img.onload();   // already cached: load fired before the handler existed
    const openLb = () => lightbox(items, i);
    t.querySelector('.media').onclick = openLb;
    t.querySelector('.media').onkeydown = e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), openLb());
    t.querySelector('.actions .btn').onclick = openLb;
    g.append(t);
  });
}

// ---------- Profile: biography, skills, voice lines ----------
let pendingClip = null, profileAudio = null;
function playPendingClip() {
  if (!pendingClip || !modelReady || !modelStage?.clipNames.includes(pendingClip)) return;
  modelAdapter.setAnimation(pendingClip); pendingClip = null;
}
function watchClip(clip) {
  pendingClip = clip;
  selectTab('model');   // not "picked": the next hero still opens on the tab you chose yourself
  playPendingClip();
}
function stopProfileAudio() {
  profileAudio?.pause(); profileAudio = null;
  document.querySelectorAll('#profile .vplay.on').forEach(b => { b.classList.remove('on'); b.innerHTML = icon('play'); });
}
const profileOpen = { stories: recall('profileStories', 'false') === 'true' };

function showProfile() {
  const p = profiles[hero.id], box = $('#profile');
  stopProfileAudio();
  if (!p) { box.innerHTML = '<div class="list-empty">No profile for this hero.</div>'; return; }
  const b = p.bio || {}, hasClip = new Set(hero.skins.flatMap(sk => sk.model ? models_clipNames(sk.model) : []));   // clips any outfit's model has
  const facts = [['Mythology', b.origin], ['Height', b.height], ['Weight', b.weight], ['Role', b.role]].filter(([, v]) => v);
  const kindTag = k => `<span class="ptag ${k === 'Ultimate' ? 'ult' : k === 'Talent' ? 'tal' : ''}">${esc(k)}</span>`;
  box.innerHTML = `
    ${b.quote ? `<blockquote class="pquote">“${esc(b.quote)}”${b.quote2 ? `<span>${esc(b.quote2)}</span>` : ''}</blockquote>` : ''}
    ${facts.length ? `<dl class="pfacts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
    ${p.skills.length ? `<section class="psec"><h3>Skills</h3><div class="pskills">${p.skills.map((sk, i) => `
      <article class="pskill">
        ${sk.icon ? `<img class="sicon" src="${esc(sk.icon)}" alt="" loading="lazy">` : `<span class="sicon ph"></span>`}
        <div class="sbody">
          <div class="shead"><b>${esc(sk.name)}</b>${kindTag(sk.kind)}${sk.cooldown ? `<span class="scd" data-tip="Cooldown">${sk.cooldown}s</span>` : ''}</div>
          <div class="sdesc">${sk.desc || ''}</div>
          ${sk.descMax ? `<button class="slvl" data-i="${i}" type="button">Show level ${sk.levels}</button>` : ''}
          ${sk.clips.some(c => hasClip.has(c)) ? `<div class="sclips">${sk.clips.filter(c => hasClip.has(c)).map((c, n, all) =>
            `<button class="btn sm" data-clip="${esc(c)}">${icon('box')}${all.length > 1 ? `Part ${n + 1}` : 'Watch in 3D'}</button>`).join('')}</div>` : ''}
        </div>
      </article>`).join('')}</div></section>` : ''}
    ${p.stars.length ? `<section class="psec"><h3>Star upgrades</h3><ul class="pstars">${p.stars.map(st => `<li><b>★${st.star}</b><span>${st.text}</span></li>`).join('')}</ul></section>` : ''}
    ${p.voices.length ? `<section class="psec"><div class="row-between"><h3>Voice lines</h3><span class="vlang"></span></div>${voiceGroups(p.voices)}</section>` : ''}
    ${b.stories?.length ? `<section class="psec"><details class="pstory"${profileOpen.stories ? ' open' : ''}><summary><h3>Story</h3><span>${b.stories.length} chapters</span></summary>
      ${b.stories.map((t, i) => `<div class="pchap"><h4>Chapter ${i + 1}</h4><p>${t}</p></div>`).join('')}</details></section>` : ''}`;
  box.scrollTop = 0;
  box.querySelectorAll('[data-clip]').forEach(btn => btn.onclick = () => watchClip(btn.dataset.clip));
  box.querySelectorAll('.slvl').forEach(btn => btn.onclick = () => {
    const sk = p.skills[+btn.dataset.i], d = btn.parentElement.querySelector('.sdesc'), max = btn.dataset.max !== '1';
    d.innerHTML = max ? sk.descMax : sk.desc; btn.dataset.max = max ? '1' : ''; btn.textContent = max ? 'Show level 1' : `Show level ${sk.levels}`;
  });
  box.querySelector('.pstory')?.addEventListener('toggle', e => store('profileStories', String(e.target.open)));
  const vl = box.querySelector('.vlang');
  if (vl) vl.append(segmented({ value: voiceSettings.lang, onChange: v => { voiceSettings.lang = v; saveVoiceSettings(); stopProfileAudio(); },
    options: [{ value: 'ja', label: 'Japanese' }, { value: 'zh', label: 'Chinese' }] }));
  box.querySelectorAll('.vplay').forEach(btn => btn.onclick = () => {
    const v = p.voices[+btn.dataset.i], was = btn.classList.contains('on');
    stopProfileAudio(); stopVoice();
    if (was) return;
    const file = v.files[voiceSettings.lang] || v.files.ja || v.files.zh;
    profileAudio = new Audio(file); profileAudio.volume = voiceSettings.volume;
    btn.classList.add('on'); btn.innerHTML = icon('pause');
    profileAudio.onended = () => stopProfileAudio();
    profileAudio.play().catch(() => stopProfileAudio());
  });
}
const models_clipNames = key => (models[key]?.clips || []).map(c => c.name);
function voiceGroups(voices) {
  const groups = {};
  voices.forEach((v, i) => (groups[v.group] ||= []).push([v, i]));
  return Object.entries(groups).map(([g, list]) => `<div class="vgroup"><h4>${esc(g)}</h4>${list.map(([v, i]) => {
    const file = v.files[voiceSettings.lang] || v.files.ja || v.files.zh;
    const label = v.text ? esc(v.text) : `<span class="dim">${esc([v.outfit, v.label?.replace(/^touch/, 'tap ')].filter(Boolean).join(' · ') || 'No transcript')}</span>`;
    return `<div class="vline"><button class="btn icon sm vplay" data-i="${i}" aria-label="Play">${icon('play')}</button>
      <span class="vtext">${label}${v.text && v.outfit ? `<small>${esc(v.outfit)}</small>` : ''}</span>
      <a class="btn icon ghost sm" href="${esc(file)}" download data-tip="Download" aria-label="Download">${icon('download')}</a></div>`;
  }).join('')}</div>`).join('');
}

// ---------- Videos ----------
let video = null;
function showVideos() {
  video ||= createVideoPlayer($('#videoBox'));
  const labels = { intro: 'Showcase intro', loop: 'Showcase loop' };
  video.setSources(Object.entries(skin.videos).map(([k, src]) => ({ label: labels[k] || k, src, download: safeFilename(`${hero.name} - ${skin.name} - ${labels[k] || k}`) + '.webm' })));
}

// ---------- 3D model ----------
let modelStage = null, modelLoaded = null, modelReady = false;
const modelView = { lighting: recall('modelLighting', 'lit'), bg: recall('modelBg', '#1d1d23'), speed: 1, autoRotate: false, autoplay: recall('modelAutoplay') === 'true', loop: recall('modelLoop') === 'true', scenery: recall('modelScenery', 'none') };
// Scenery behind the model: plain colour, the outfit's painted background, or a battlefield floor
const sceneryFor = v => v === 'outfit' ? (skin?.art.background ? { image: skin.art.background } : null)
  : v?.startsWith('arena:') && arenas[v.slice(6)] ? { floor: arenas[v.slice(6)].src } : null;
const modelAdapter = {
  kind: 'model',
  ready: () => modelReady && !!modelStage?.model,
  get paused() { return modelStage.paused; }, get time() { return modelStage.time; }, get duration() { return modelStage.duration(); },
  pause: () => modelStage.pause(), resume: () => modelStage.resume(), seek: t => modelStage.seek(t),
  // Readable names: the game's own skill names where known, best-guess translations otherwise; the clip's real name as a hint
  animations: () => modelStage.clipNames.map(c => ({ value: c, label: clipLabel(c, hero.skillClips), hint: c, group: groupClip(c) }))
    .sort((a, b) => a.group.localeCompare(b.group) || (a.group === 'Skills' ? a.value.localeCompare(b.value) : a.label.localeCompare(b.label))),
  current: () => modelStage.clipName,
  setAnimation: n => { modelStage.play(n); modelStage.resume(); modelDock.sync(); },   // picking a clip plays it
  settings: modelSettings,
  beginCapture: o => modelStage.beginCapture(o),
  aspect: () => { const c = modelStage.renderer.domElement; return c.width / c.height; },
  filename: ({ turntable }) => `${hero.name} - ${skin.name} - ${clipLabel(modelStage.clipName, hero.skillClips)}${turntable ? ' - turntable' : ''}`,
};
const modelDock = createDock($('#modelWrap'), modelAdapter, { onSnapshot: () => drawer.snapshot(modelAdapter) });

function modelSettings() {
  const el = h(`<div style="display:grid;gap:16px;width:280px">
    <div class="pop-row"><h4>Lighting</h4><div class="lt"></div></div>
    <div class="pop-row"><h4>Scenery</h4><div class="scn"></div></div>
    <div class="pop-row"><h4>Background</h4><div class="bg"></div></div>
    <div class="pop-row"><h4>Speed</h4><div class="spd"></div></div>
    <div class="pop-row ar" style="display:grid;gap:10px"></div>
    <button class="btn reset" data-kbd="R">${icon('reset')}Reset camera</button></div>`);
  el.querySelector('.lt').append(segmented({ block: true, value: modelView.lighting, onChange: v => { modelView.lighting = v; store('modelLighting', v); modelStage.setLighting(v); },
    options: [{ value: 'lit', label: 'Lit' }, { value: 'toon', label: 'Toon', tip: 'Cel shading, closest to the game' }, { value: 'unlit', label: 'Unlit', tip: 'Flat texture colours' }] }));
  const scn = dropdown({ value: modelView.scenery, searchable: false, onChange: v => { modelView.scenery = v; store('modelScenery', v); modelStage.setBackdrop(sceneryFor(v)); },
    items: [{ value: 'none', label: 'Plain colour' }, { value: 'outfit', label: 'Outfit background', hint: skin?.art.background ? '' : 'none for this outfit' },
            ...Object.values(arenas).map(a => ({ value: 'arena:' + a.id, label: a.name, group: 'Battlefield floor' }))] });
  scn.style.width = '100%';
  el.querySelector('.scn').append(scn);
  el.querySelector('.bg').append(swatches({ value: modelView.bg, onChange: v => { modelView.bg = v; store('modelBg', v); modelStage.setBackground(v); },
    options: [{ value: '#1d1d23', label: 'Dark' }, { value: '#3b3f4c', label: 'Slate' }, { value: '#8a8f9c', label: 'Grey' }, { value: '#ffffff', label: 'White' }, { value: '#00b140', label: 'Green screen' }] }));
  el.querySelector('.spd').append(segmented({ block: true, value: modelView.speed, onChange: v => { modelView.speed = v; modelStage.speed = v; },
    options: [0.25, 0.5, 1, 1.5, 2].map(v => ({ value: v, label: v + '×' })) }));
  el.querySelector('.ar').append(toggle({ label: 'Auto-play animation', checked: modelView.autoplay, onChange: v => { modelView.autoplay = v; store('modelAutoplay', v); } }));
  el.querySelector('.ar').append(toggle({ label: 'Loop animation', checked: modelView.loop, onChange: v => { modelView.loop = v; store('modelLoop', v); modelStage.loop = v; } }));
  el.querySelector('.ar').append(toggle({ label: 'Auto-rotate', checked: modelView.autoRotate, onChange: v => { modelView.autoRotate = v; modelStage.controls.autoRotate = v; } }));
  el.querySelector('.reset').onclick = () => { modelStage.frame(); closePopovers(); };
  return el;
}

async function showModel() {
  if (!modelStage) {
    setLoading($('#modelLoading'), 'loading', 'Starting 3D viewer…');
    try {
      const { ModelStage } = await import('./js/model-stage.js');
      modelStage = new ModelStage($('#modelBox'));
    } catch (e) { setLoading($('#modelLoading'), 'error', 'Couldn’t start the 3D viewer: ' + e.message); return; }
    modelStage.setBackground(modelView.bg); modelStage.lighting = modelView.lighting; modelStage.loop = modelView.loop;
    modelStage.controls.addEventListener('start', () => $('#modelHint').style.opacity = 0);
  }
  if (modelLoaded === skin.model) { if (modelView.scenery === 'outfit') modelStage.setBackdrop(sceneryFor('outfit')); playPendingClip(); return; }
  modelLoaded = skin.model; modelReady = false;
  setLoading($('#modelLoading'), 'loading', 'Loading model…');
  modelDock.el.style.visibility = 'hidden';
  try { await modelStage.load(models[skin.model].glb); }
  catch (e) { if (modelLoaded === skin.model) setLoading($('#modelLoading'), 'error', 'Couldn’t load this model: ' + e.message); return; }
  if (modelLoaded !== skin.model) return;
  modelStage.speed = modelView.speed; modelStage.controls.autoRotate = modelView.autoRotate;
  modelStage.setBackdrop(sceneryFor(modelView.scenery));
  modelView.autoplay ? modelStage.resume() : modelStage.pause();   // off by default: hold the idle pose until Play
  modelReady = true;
  setLoading($('#modelLoading'), null);
  modelDock.el.style.visibility = '';
  modelDock.refresh();
  playPendingClip();   // a skill's "Watch in 3D" from the Profile
}

// ---------- What's new (written by _tools/update.py) ----------
function showWhatsNew() {
  const w = whatsNew, link = (hId, sId, label) => `<a href="#h=${hId}${sId ? `&s=${sId}` : ''}" class="wn-link">${esc(label)}</a>`;
  const sec = (title, items) => items.length ? `<h4 style="margin:14px 0 6px">${title}</h4><div style="display:grid;gap:4px">${items.join('')}</div>` : '';
  const body = h(`<div><div style="color:var(--muted)">Changes found ${esc(w.date)} · ${esc(w.gameVersion)}${w.lastChecked && w.lastChecked !== w.date ? ` · last checked ${esc(w.lastChecked)}` : ''}</div>
    ${sec('New heroes', w.newHeroes.map(x => link(x.hero, null, x.name)))}
    ${sec('New outfits', w.newOutfits.map(x => link(x.hero, x.skin, x.name)))}
    ${sec('Outfits with new content', w.upgradedOutfits.map(x => link(x.hero, x.skin, `${x.name} (+${x.added.map(k => ({ spine: 'animation', model: '3D model', video: 'videos' })[k] || k).join(', ')})`)))}
    ${w.newHeroes.length + w.newOutfits.length + w.upgradedOutfits.length ? '' : '<p style="color:var(--muted)">Nothing new in the last update.</p>'}</div>`);
  const m = modal({ title: 'What’s new', body });
  if (!wnSeen.opened) { wnSeen.opened = true; saveSeen(); $('#whatsNew .badge')?.remove(); }
  body.querySelectorAll('.wn-link').forEach(a => a.addEventListener('click', () => m.close()));
}
if (whatsNew) {
  const n = whatsNew.newHeroes.length + whatsNew.newOutfits.length + whatsNew.upgradedOutfits.length;
  $('#whatsNew').style.display = '';
  $('#whatsNew').innerHTML = `${icon('sparkles')}${n && !wnSeen.opened ? `<span class="badge dot">${n > 99 ? '99+' : n}</span>` : ''}`;
  $('#whatsNew').onclick = () => showWhatsNew();
}

// ---------- Keyboard shortcuts ----------
const SHORTCUTS = [
  ['Search heroes', '/'], ['Previous / next hero', '↑ ↓'], ['Previous / next outfit', '← →'], ['Switch tab', '1–5'],
  ['Play / pause', 'Space'], ['Export', 'E'], ['Save still image', 'S'], ['Fullscreen', 'F'], ['Reset 3D camera', 'R'], ['Sound on / off', 'M'], ['This help', '?'],
];
function showHelp() {
  modal({ title: 'Keyboard shortcuts', body: h(`<div class="shortcuts">${SHORTCUTS.map(([l, k]) => `<span>${esc(l)}</span><span>${k.split(' ').map(x => `<kbd>${esc(x)}</kbd>`).join(' ')}</span>`).join('')}</div>`) });
}
$('#helpBtn').onclick = showHelp;

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || typing(e) || anyLayerOpen() || drawer.isOpen || document.querySelector('.lightbox, .modal')) return;
  const k = e.key;
  const step = (arr, cur, d) => arr[(arr.indexOf(cur) + d + arr.length) % arr.length];
  if (k === '/') { e.preventDefault(); $('#app').classList.add('nav-open'); $('#q').focus(); $('#q').select(); }
  else if (k === '?') showHelp();
  else if (k === 'ArrowDown' || k === 'ArrowUp') { if (visible.length) { e.preventDefault(); selectHero(step(visible, hero, k === 'ArrowDown' ? 1 : -1)); } }
  else if (k === 'ArrowLeft' || k === 'ArrowRight') { if (hero.skins.length > 1) { e.preventDefault(); selectSkin(step(hero.skins, skin, k === 'ArrowRight' ? 1 : -1)); } }
  else if (k >= '1' && k <= '5') { const t = document.querySelectorAll('.tab')[+k - 1]; if (!t.disabled) pickTab(t.dataset.tab); }
  else if (k === ' ') {
    const a = activeAdapter();
    if (tab === 'video') { e.preventDefault(); video?.toggle(); }
    else if (a?.ready()) { e.preventDefault(); a.paused ? a.resume() : a.pause(); }
  }
  else if (k.toLowerCase() === 'e') activeAdapter() && drawer.open(activeAdapter());
  else if (k.toLowerCase() === 's') activeAdapter()?.ready() && drawer.snapshot(activeAdapter());
  else if (k.toLowerCase() === 'f') $('#fullBtn').style.display !== 'none' && $('#fullBtn').click();
  else if (k.toLowerCase() === 'r' && tab === 'model') modelStage?.frame();
  else if (k.toLowerCase() === 'm' && tab === 'spine') { sound.set(!sound.on); spineDock.syncSound(); toast(sound.on ? 'Sound on' : 'Sound off', { duration: 1500 }); }
});

// ---------- Start ----------
renderHeroes();
route();
</script>
